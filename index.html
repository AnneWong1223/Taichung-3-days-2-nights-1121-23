<head>

    :root {
      --pingu-black: #0f172a;
      --pingu-navy: #1e293b;
      --pingu-orange: #ea580c;
      --pingu-beak: #f97316;
      --wedding-rose: #f43f5e;
      --wedding-pink-bg: #fff1f2;
      --wedding-border: #fecdd3;
      --ice-blue: #e0f2fe;
      --ice-blue-text: #0284c7;
      --cream-bg: #fffaf5;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      --border-radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "微軟正黑體", Arial, sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 頂部 Pingu 婚禮 Header */
    header {
      text-align: center;
      padding: 26px 16px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #881337 100%);
      border-radius: var(--border-radius);
      color: #ffffff;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
      border: 2px solid rgba(251, 113, 133, 0.3);
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: "🐧🎩";
      position: absolute;
      left: 16px;
      top: 14px;
      font-size: 2rem;
    }
    header::after {
      content: "🐧👰‍♀️💐";
      position: absolute;
      right: 16px;
      top: 14px;
      font-size: 2rem;
    }
    header h1 {
      font-size: 1.55rem;
      color: #ffe4e6;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .header-sub {
      font-size: 0.92rem;
      color: #fecdd3;
      font-weight: 500;
    }
    .header-tagline {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
