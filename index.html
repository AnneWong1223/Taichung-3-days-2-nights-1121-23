<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐧💒 Noot Noot! 妮蓁婚禮 ＆ 閨蜜台中度假遊 💍</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --pingu-black: #18181b;
      --pingu-orange: #ea580c;
      --wedding-rose: #f43f5e;
      --wedding-pink-bg: #fff1f2;
      --wedding-border: #fecdd3;
      --ice-blue: #e0f2fe;
      --ice-blue-text: #0284c7;
      --cream-bg: #faf5ee;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      --border-radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "微軟正黑體", Arial, sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    /* 頂部 Header */
    header {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 60%, #4c0519 100%);
      border-radius: var(--border-radius);
      color: #ffffff;
      margin-bottom: 20px;
      padding: 22px 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.28);
      border: 2px solid rgba(251, 113, 133, 0.35);
      position: relative;
      overflow: hidden;
    }

    .pingu-stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .pingu-char {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
    .pingu-char:hover { transform: scale(1.1) rotate(-3deg); }
    .pingu-char:active { transform: scale(0.95); }

    .pingu-title-box {
      flex: 1;
      text-align: center;
      padding: 0 10px;
    }
    .header-h1 {
      font-size: 1.45rem;
      color: #ffe4e6;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 6px;
    }
    .header-sub {
      font-size: 0.88rem;
      color: #fecdd3;
      font-weight: 500;
    }
    .header-tagline {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #ffffff;
    }

    .speech-bubble {
      position: absolute;
      top: 10px;
      right: 14px;
      background: #ffffff;
      color: #be123c;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.75rem;
      border: 2px solid #f43f5e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: floatNoot 2s infinite ease-in-out;
      pointer-events: none;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 16px;
      border-width: 7px 5px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    @keyframes floatNoot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--wedding-border);
    }
    .sync-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .btn-sync {
      background: linear-gradient(135deg, var(--pingu-orange), #f97316);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(234, 88, 12, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-sync:hover { opacity: 0.92; transform: translateY(-1px); }

    /* 主頁籤按鈕 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      flex: 1;
      min-width: 90px;
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #090d16, #1e293b);
      color: #ffe4e6;
      border-color: var(--wedding-rose);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    /* Day 1 去程方案切換區 */
    .plan-selector-box {
      background: var(--wedding-pink-bg);
      border: 1.5px solid var(--wedding-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(244, 63, 94, 0.08);
    }
    .plan-selector-title {
      font-size: 0.88rem;
      font-weight: bold;
      color: #9f1239;
      margin-bottom: 8px;
    }
    .plan-btn-group { display: flex; gap: 8px; }
    .plan-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      text-align: center;
      transition: all 0.2s;
    }
    .plan-btn.active {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #ffffff;
      border-color: #be123c;
      box-shadow: 0 3px 8px rgba(225, 29, 72, 0.3);
    }

    /* 行程項目卡片 */
    .day-section { margin-bottom: 26px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .day-badge {
      background: linear-gradient(135deg, #090d16, #1e293b);
      color: #ffe4e6;
      padding: 4px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border-left: 4px solid var(--pingu-orange);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
    }
    .day-badge.wedding {
      background: linear-gradient(135deg, #be123c, #fb7185);
      border-left-color: #ffffff;
    }
    .day-date { font-size: 0.95rem; color: #64748b; font-weight: 600; }

    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid #f1f5f9;
      border-left: 4px solid var(--pingu-orange);
    }
    .item-card.wedding-card {
      border-left-color: var(--wedding-rose);
      background: #fffdfd;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .item-time {
      background: var(--wedding-pink-bg);
      color: #be123c;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--wedding-border);
    }
    .item-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
      margin: 4px 0 8px 0;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag {
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tag.trans {
      background: var(--ice-blue);
      color: var(--ice-blue-text);
      font-weight: 600;
      border: 1px solid #bae6fd;
    }
    .tag.cost {
      background: #fff7ed;
      color: var(--pingu-orange);
      font-weight: bold;
      border: 1px solid #fed7aa;
    }
    .item-detail {
      font-size: 0.88rem;
      color: #334155;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--pingu-orange);
      margin-top: 6px;
    }
    .item-detail.wedding-detail {
      background: #fff5f5;
      border-left-color: var(--wedding-rose);
    }
    .item-detail-row { margin-bottom: 4px; }
    .item-detail-row:last-child { margin-bottom: 0; }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      background: var(--wedding-pink-bg);
      color: #be123c;
      border: 1px solid var(--wedding-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #ffe4e6; }

    /* 備忘清單卡片樣式 */
    .checklist-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
      border-left: 5px solid #6366f1;
    }
    .checklist-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .checklist-cat {
      background: #eef2ff;
      color: #4338ca;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .checklist-owner {
      background: #f1f5f9;
      color: #475569;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .checklist-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .checklist-date {
      color: #e11d48;
      font-weight: 700;
      font-size: 0.88rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .checklist-guide {
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.86rem;
      color: #334155;
      border-left: 3px solid #6366f1;
    }
  </style>
</head>
<body>

      <div class="pingu-stage">

        <div class="pingu-char" onclick="pinguClick()" title="點我聽 Noot Noot!">

          </svg>
        </div>
      </div>
    </header>

    <div class="status-bar">
      <span class="sync-text" id="sync-status">⏳ 正在連線 Google 試算表...</span>
      <button class="btn-sync" onclick="fetchAllData()">🔄 Noot! 即時同步</button>
    </div>

    <div class="tabs" id="tab-container">
      <button class="tab-btn active" onclick="filterDay('ALL')">全部行程 📜</button>
      <button class="tab-btn" onclick="filterDay('Day 1')">Day 1 抵達與小次男 🎒</button>
      <button class="tab-btn" onclick="filterDay('Day 2')">Day 2 妮蓁浪漫婚禮 💒</button>
      <button class="tab-btn" onclick="filterDay('Day 3')">Day 3 歌劇院與火鍋 🍲</button>
      <button class="tab-btn" onclick="filterDay('CHECKLIST')">📋 備忘與待辦清單</button>
    </div>

    <div class="plan-selector-box" id="day1-plan-box">
      <div class="plan-selector-title">🔀 點選切換 Day 1 去程交通方案：</div>
      <div class="plan-btn-group">
        <button class="plan-btn active" id="btn-plan2" onclick="switchDay1Plan('方案2')">🚗 方案 2：Uber 直達林酒店 (推薦首選 🏆)</button>
        <button class="plan-btn" id="btn-plan1" onclick="switchDay1Plan('方案1')">🚌 方案 1：專用道公車慢活</button>
      </div>
    </div>

    <div id="content-container"></div>

  <script>
    // 1. 行程總表專屬 CSV 網址
    const TRIP_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRn1rrE8yezs0akieynsjq-XVIxdBAEwymi6UwLPRtfQ9y1HCmUINXmXdiQwjal9Q/pub?output=csv";
    
    // 2. 備忘清單專屬 CSV 網址（已自動填入圖二專屬網址）
    const CHECKLIST_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRn1rrE8yezs0akieynsjq-XVIxdBAEwymi6UwLPRtfQ9y1HCmUINXmXdiQwjal9Q/pub?gid=1987664974&single=true&output=csv";

    let currentChecklist = [];
    let allTripData = [];
    let currentFilter = 'ALL';
    let currentDay1Plan = '方案2';

    function pinguClick() {
      const bubble = document.getElementById('noot-box');
      bubble.innerText = "NOOT NOOT!! 🎺✨";
      bubble.style.transform = "scale(1.25) rotate(-6deg)";
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(540, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
      setTimeout(() => {
        bubble.innerText = "NOOT NOOT! 🎺";
        bubble.style.transform = "scale(1)";
      }, 1200);
    }

    function buildHeaderMap(headers) {
      const map = {};
      headers.forEach((h, i) => {
        if (!h) return;
        const name = String(h).trim();
        if (name.includes('天數')) map.day = i;
        else if (name.includes('日期')) map.date = i;
        else if (name.includes('時間')) map.time = i;
        else if (name.includes('行程') || name.includes('主題')) {
          if (map.title === undefined) map.title = i;
        }
        else if (name.includes('動線')) map.route = i;
        else if (name.includes('工具')) map.trans = i;
        else if (name.includes('停留')) map.stayTime = i;
        else if (name.includes('費用')) map.cost = i;
        else if (name.includes('備註')) map.remark = i;
      });
      return map;
    }

    function renderItinerary() {
      const contentEl = document.getElementById('content-container');
      const planBox = document.getElementById('day1-plan-box');

      if (currentFilter === 'CHECKLIST') {
        planBox.style.display = 'none';
        let html = `
          <div class="day-section">
            <div class="day-header">
              <span class="day-badge" style="background: linear-gradient(135deg, #4338ca, #6366f1); border-left-color: #a5b4fc;">📋 重要待辦確認事項與行前備忘清單</span>
            </div>
        `;
        if (currentChecklist.length === 0) {
          html += `<div style="text-align:center; padding:30px; color:#64748b;">🐧 備忘清單載入中...</div>`;
        } else {
          currentChecklist.forEach(item => {
            html += `
              <div class="checklist-card">
                <div class="checklist-top">
                  <span class="checklist-cat">${item.cat}</span>
                  <span class="checklist-owner">👤 ${item.owner}</span>
                </div>
                <div class="checklist-title">${item.title}</div>
                <div class="checklist-date">⏰ 截止/執行日：${item.date}</div>
                <div class="checklist-guide">💡 <strong>指引：</strong>${item.guide}</div>
              </div>
            `;
          });
        }
        html += `</div>`;
        contentEl.innerHTML = html;
        return;
      }

      if (currentFilter === 'ALL' || currentFilter === 'Day 1') {
        planBox.style.display = 'block';
      } else {
        planBox.style.display = 'none';
      }

      let filtered = allTripData.filter(item => {
        if (!item.day) return false;
        if (item.day.includes('Day 1')) {
          if (currentFilter !== 'ALL' && currentFilter !== 'Day 1') return false;
          if (item.day.includes('方案')) {
            return item.day.includes(currentDay1Plan);
          }
          return true;
        }
        if (currentFilter === 'ALL') return true;
        return item.day.includes(currentFilter);
      });

      if (filtered.length === 0) {
        contentEl.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">🐧 Noot! 正在載入或此分類無行程。</div>`;
        return;
      }

      const groups = {};
      filtered.forEach(item => {
        const key = `${item.day || '行程'}__${item.date || ''}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      let html = "";
      for (const groupKey in groups) {
        const [dayName, dateName] = groupKey.split('__');
        const isWeddingDay = dayName.includes('Day 2');

        html += `
          <div class="day-section">
            <div class="day-header">
              <span class="day-badge ${isWeddingDay ? 'wedding' : ''}">🐧 ${dayName}</span>
              ${dateName ? `<span class="day-date">${dateName}</span>` : ''}
            </div>
        `;

        groups[groupKey].forEach(item => {
          const mapQuery = encodeURIComponent(item.title.replace(/【.*?】/g, '').replace(/\(.*?\)/g, ''));
          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
          const isItemWedding = (item.title && (item.title.includes('婚禮') || item.title.includes('婚宴')));

          html += `
            <div class="item-card ${isItemWedding ? 'wedding-card' : ''}">
              <div class="item-top">
                <span class="item-time">⏰ ${item.time || '行程'}</span>
                ${isItemWedding ? `<span class="tag" style="background:#ffe4e6; color:#be123c; font-weight:bold;">💒 幸福婚宴焦點</span>` : ''}
              </div>
              <div class="item-title">${item.title}</div>
              
              <div class="tags">
                ${item.trans && item.trans !== '-' ? `<span class="tag trans">🚗 ${item.trans}</span>` : ''}
                ${item.stayTime && item.stayTime !== '-' ? `<span class="tag">⏳ 停留: ${item.stayTime}</span>` : ''}
                ${item.cost && item.cost !== '-' && item.cost !== '0' && item.cost !== '$0' ? `<span class="tag cost">💰 ${item.cost}</span>` : ''}
              </div>

              ${(item.route || item.remark) ? `
                <div class="item-detail ${isItemWedding ? 'wedding-detail' : ''}">
                  ${item.route && item.route !== '-' ? `<div class="item-detail-row">📍 <strong>動線：</strong>${item.route}</div>` : ''}
                  ${item.remark && item.remark !== '-' ? `<div class="item-detail-row">💡 <strong>備註：</strong>${item.remark}</div>` : ''}
                </div>
              ` : ''}

              <a href="${mapUrl}" target="_blank" class="nav-btn">📍 Google 地圖導航</a>
            </div>
          `;
        });

        html += `</div>`;
      }

      contentEl.innerHTML = html;
    }

    function filterDay(day) {
      currentFilter = day;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', 
          (day === 'CHECKLIST' && btn.innerText.includes('備忘')) ||
          (day === 'ALL' && btn.innerText.includes('全部')) ||
          (day !== 'CHECKLIST' && day !== 'ALL' && btn.innerText.includes(day))
        );
      });
      renderItinerary();
    }

    function switchDay1Plan(plan) {
      currentDay1Plan = plan;
      document.getElementById('btn-plan1').classList.toggle('active', plan === '方案1');
      document.getElementById('btn-plan2').classList.toggle('active', plan === '方案2');
      renderItinerary();
    }

    function fetchAllData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "⏳ 正在同步 Google 試算表最新資料...";
      
      const cacheBust = "&_cb=" + new Date().getTime();
      const tripUrl = TRIP_CSV_URL + cacheBust;
      const chkUrl = CHECKLIST_CSV_URL + cacheBust;

      // 1. 同步行程總表
      Papa.parse(tripUrl, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 1) {
            const rows = results.data;
            let headerIdx = rows.findIndex(r => r.some(cell => typeof cell === 'string' && cell.trim() === '天數'));
            if (headerIdx === -1) {
              headerIdx = rows.findIndex(r => r.some(cell => typeof cell === 'string' && cell.includes('天數')));
            }
            if (headerIdx === -1) headerIdx = 0;

            const headerMap = buildHeaderMap(rows[headerIdx]);
            const dataRows = rows.slice(headerIdx + 1).filter(r => r && r.some(c => c && String(c).trim() !== ""));

            if (dataRows.length > 0) {
              allTripData = dataRows.map(r => {
                const getVal = (f) => (headerMap[f] !== undefined && r[headerMap[f]]) ? String(r[headerMap[f]]).trim() : "";
                return {
                  day: getVal('day'),
                  date: getVal('date'),
                  time: getVal('time'),
                  title: getVal('title'),
                  route: getVal('route'),
                  trans: getVal('trans'),
                  stayTime: getVal('stayTime'),
                  cost: getVal('cost'),
                  remark: getVal('remark')
                };
              });
            }
          }

          // 2. 同步備忘清單
          Papa.parse(chkUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(chkResults) {
              if (chkResults.data && chkResults.data.length > 2) {
                const cRows = chkResults.data;
                let hIdx = cRows.findIndex(r => r.some(c => typeof c === 'string' && (c.includes('待辦') || c.includes('項目'))));
                if (hIdx === -1) hIdx = 1;
                
                const dRows = cRows.slice(hIdx + 1).filter(r => r[1] && String(r[1]).trim() !== "");
                if (dRows.length > 0) {
                  currentChecklist = dRows.map(r => ({
                    cat: r[0] ? String(r[0]).trim() : "待辦",
                    title: r[1] ? String(r[1]).trim() : "",
                    date: r[2] ? String(r[2]).trim() : "",
                    owner: r[3] ? String(r[3]).trim() : "",
                    guide: r[4] ? String(r[4]).trim() : ""
                  }));
                }
              }
              renderItinerary();
              showSuccess();
            },
            error: function() {
              renderItinerary();
              showSuccess();
            }
          });
        },
        error: function() {
          statusEl.innerText = `❌ 連線失敗，請檢查網路狀態`;
        }
      });
    }

    function showSuccess() {
      const statusEl = document.getElementById('sync-status');
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      statusEl.innerText = `✅ Pingu 已同步最新行程（${timeStr}）`;
    }

    fetchAllData();
  </script>
</body>
</html>
