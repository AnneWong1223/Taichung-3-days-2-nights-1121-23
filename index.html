<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐧💒 Noot Noot! 妮蓁婚禮 ＆ 閨蜜台中度假遊 💍</title>
  <!-- 引入穩定 CSV 解析套件 PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --pingu-black: #18181b;
      --pingu-belly: #f8fafc;
      --pingu-orange: #ea580c;
      --pingu-beak-red: #dc2626;
      --pingu-beak-lip: #f97316;
      --wedding-rose: #f43f5e;
      --wedding-pink-bg: #fff1f2;
      --wedding-border: #fecdd3;
      --ice-blue: #e0f2fe;
      --ice-blue-text: #0284c7;
      --cream-bg: #faf5ee;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      --border-radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "微軟正黑體", Arial, sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 頂部 Pingu 經典黏土動畫 Header */
    header {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 60%, #4c0519 100%);
      border-radius: var(--border-radius);
      color: #ffffff;
      margin-bottom: 20px;
      padding: 24px 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.28);
      border: 2px solid rgba(251, 113, 133, 0.35);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 左右兩隻經典 Pingu 舞台區 */
    .pingu-stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 700px;
      margin-bottom: 12px;
      padding: 0 10px;
    }

    .pingu-char {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .pingu-char:hover {
      transform: scale(1.1) rotate(-3deg);
    }
    .pingu-char:active {
      transform: scale(0.95);
    }

    .pingu-title-box {
      flex: 1;
      padding: 0 12px;
    }
    .header-h1 {
      font-size: 1.55rem;
      color: #ffe4e6;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 6px;
    }
    .header-sub {
      font-size: 0.92rem;
      color: #fecdd3;
      font-weight: 500;
    }
    .header-tagline {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Noot Noot 浮動對話框 */
    .speech-bubble {
      position: absolute;
      top: 15px;
      right: 18px;
      background: #ffffff;
      color: #be123c;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.78rem;
      border: 2px solid #f43f5e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: floatNoot 2s infinite ease-in-out;
      pointer-events: none;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 18px;
      border-width: 8px 6px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    @keyframes floatNoot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* 狀態列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--wedding-border);
    }
    .sync-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .btn-sync {
      background: linear-gradient(135deg, var(--pingu-orange), #f97316);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(234, 88, 12, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-sync:hover { opacity: 0.92; transform: translateY(-1px); }

    /* 主頁籤按鈕 */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      flex: 1;
      min-width: 90px;
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #090d16, #1e293b);
      color: #ffe4e6;
      border-color: var(--wedding-rose);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    /* Day 1 去程方案切換膠囊 */
    .plan-selector-box {
      background: var(--wedding-pink-bg);
      border: 1.5px solid var(--wedding-border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(244, 63, 94, 0.08);
    }
    .plan-selector-title {
      font-size: 0.88rem;
      font-weight: bold;
      color: #9f1239;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .plan-btn-group {
      display: flex;
      gap: 8px;
    }
    .plan-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      text-align: center;
      transition: all 0.2s;
    }
    .plan-btn.active {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #ffffff;
      border-color: #be123c;
      box-shadow: 0 3px 8px rgba(225, 29, 72, 0.3);
    }

    /* 行程項目卡片 */
    .day-section { margin-bottom: 26px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .day-badge {
      background: linear-gradient(135deg, #090d16, #1e293b);
      color: #ffe4e6;
      padding: 4px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      border-left: 4px solid var(--pingu-orange);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
    }
    .day-badge.wedding {
      background: linear-gradient(135deg, #be123c, #fb7185);
      border-left-color: #ffffff;
    }
    .day-date {
      font-size: 0.95rem;
      color: #64748b;
      font-weight: 600;
    }

    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid #f1f5f9;
      border-left: 4px solid var(--pingu-orange);
    }
    .item-card.wedding-card {
      border-left-color: var(--wedding-rose);
      background: #fffdfd;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .item-time {
      background: var(--wedding-pink-bg);
      color: #be123c;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--wedding-border);
    }
    .item-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
      margin: 4px 0 8px 0;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tag.trans {
      background: var(--ice-blue);
      color: var(--ice-blue-text);
      font-weight: 600;
      border: 1px solid #bae6fd;
    }
    .tag.cost {
      background: #fff7ed;
      color: var(--pingu-orange);
      font-weight: bold;
      border: 1px solid #fed7aa;
    }
    .item-detail {
      font-size: 0.88rem;
      color: #334155;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--pingu-orange);
      margin-top: 6px;
    }
    .item-detail.wedding-detail {
      background: #fff5f5;
      border-left-color: var(--wedding-rose);
    }
    .item-detail-row { margin-bottom: 4px; }
    .item-detail-row:last-child { margin-bottom: 0; }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      background: var(--wedding-pink-bg);
      color: #be123c;
      border: 1px solid var(--wedding-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #ffe4e6; }
  </style>
</head>
